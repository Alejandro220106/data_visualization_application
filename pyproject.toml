[project]
name = "app-graficos"
version = "0.1.0"
description = "Visualizador local de respuestas de Google Forms exportadas a CSV"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
